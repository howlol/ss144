name: Build Space Station 14 AI Server

on:
  push:
    branches: [ main, master, "arena/**" ]
  workflow_dispatch:

jobs:
  build-ss14-server:
    name: Build Modded SS14 Content.Server (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build SS14 Server with AIStation Mod
        run: |
          chmod +x scripts/build_ss14_server.sh
          ./scripts/build_ss14_server.sh

      - name: Package Server Artifact
        run: |
          cd /tmp/ss14-src
          dotnet run --project Content.Packaging server --platform linux-x64 --skip-build
          cp release/SS14.Server_linux-x64.zip "$GITHUB_WORKSPACE/SS14.Server_linux-x64.zip"

      - name: Upload Packaged Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS14-AI-Server-linux-x64
          path: SS14.Server_linux-x64.zip
          retention-days: 14
